services:
  - type: web
    name: wrf3km-api
    env: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: CWA_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: CACHE_TTL_SECONDS
        value: "1200"
      - key: MAX_CACHE_MB
        value: "450"
      - key: CURRENT_ROUTE_URL
        value: "https://raw.githubusercontent.com/harrypotter0618/cwa-wind/main/ride-api/routes/current.gpx"
      - key: ROUTE_CACHE_SECONDS
        value: "300"
      - key: UV_CACHE_TTL_SECONDS
        value: "1200"
      - key: KEEP_FULL_GRIB
        value: "false"

