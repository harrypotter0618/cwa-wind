services:
  - type: web
    name: wrf3km-api
    env: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: CWA_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: CACHE_TTL_SECONDS
        value: "1200"
      - key: MAX_CACHE_MB
        value: "450"
