<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>CWA 騎乘即時風況 V0.3.1</title>
<style>
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f5f6f8;color:#111}
.wrap{max-width:760px;margin:auto;padding:14px}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 6px rgba(0,0,0,.08)}
button,select,input{font-size:16px;padding:10px;border-radius:10px;border:1px solid #ccc}
button{cursor:pointer;min-height:44px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.station{border-top:1px solid #eee;padding:12px 0}
.station:first-child{border-top:0}
.muted{color:#666;font-size:14px}
.big{font-size:22px;font-weight:700}
.ok{color:#087f23}.warn{color:#b35b00}.bad{color:#b00020}
.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#eef1f5;font-size:13px;margin-left:4px}
.summary{font-size:17px;line-height:1.55}
.toggle{display:flex;gap:8px}
.toggle button.active{font-weight:700;border:2px solid #333}
@media(max-width:560px){
  .wrap{padding:10px}.card{padding:12px}
  button,select,input{width:100%;box-sizing:border-box}
  .row{align-items:stretch}.big{font-size:20px}
  .toggle{display:grid;grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="big">CWA 騎乘即時風況</div>
    <div class="muted">V0.3.1：GPS 自動 heading + 手動備援 + 前方測站動態重算 + API Key 記憶</div>
  </div>

  <div class="card">
    <div class="row">
      <label for="key">CWA API Key</label>
      <input id="key" type="password" placeholder="貼上授權碼" autocomplete="off" style="flex:1;min-width:220px" />
    </div>
    <div class="row" style="margin-top:8px">
      <label style="display:flex;align-items:center;gap:6px;font-size:14px">
        <input id="rememberKey" type="checkbox" checked style="width:auto" />
        記住 API Key（儲存在這台裝置的瀏覽器）
      </label>
      <button id="clearKeyBtn" type="button">清除已記憶 Key</button>
    </div>
    <div class="row" style="margin-top:10px">
      <button id="startBtn">開始 GPS 追蹤</button>
      <button id="stopBtn">停止追蹤</button>
      <button id="loadBtn">更新 CWA</button>
    </div>
    <div id="status" class="muted" style="margin-top:10px">尚未啟動 GPS</div>
  </div>

  <div class="card">
    <div><b>目前位置</b></div>
    <div id="pos">—</div>
    <div id="speed" class="muted">速度：—</div>
  </div>

  <div class="card">
    <div><b>騎乘方向</b></div>
    <div class="toggle" style="margin-top:8px">
      <button id="autoBtn" class="active">自動 GPS</button>
      <button id="manualBtn">手動</button>
    </div>

    <div id="autoPanel" style="margin-top:10px">
      <div id="headingDisplay" class="summary">尚未取得有效方向</div>
      <div class="muted">自動方向優先採用 GPS heading；若瀏覽器未提供 heading，則以連續 GPS 點計算。低速或停車時保留最後有效方向。</div>
    </div>

    <div id="manualPanel" style="display:none;margin-top:10px">
      <select id="manualHeading">
        <option value="0">北 0°</option>
        <option value="45">東北 45°</option>
        <option value="90">東 90°</option>
        <option value="135">東南 135°</option>
        <option value="180" selected>南 180°</option>
        <option value="225">西南 225°</option>
        <option value="270">西 270°</option>
        <option value="315">西北 315°</option>
      </select>
    </div>
  </div>

  <div class="card">
    <div><b>附近風況摘要</b></div>
    <div id="summary" class="summary muted">尚未載入</div>
  </div>

  <div class="card">
    <div><b>最近 5 個測站</b></div>
    <div id="stations" class="muted">尚未載入</div>
  </div>

  <div class="card">
    <div><b>前方 3 個測站</b></div>
    <div class="muted" style="margin:6px 0 8px">依目前 heading，自動篩選前方 ±60°、5–80 km 內測站。方向更新後會立即重新計算。</div>
    <div id="ahead" class="muted">尚未載入</div>
  </div>
</div>

<script>
const API_BASE='https://opendata.cwa.gov.tw/api/v1/rest/datastore/O-A0003-001';

let watchId=null;
let currentPos=null;
let lastPos=null;
let allStations=[];
let mode='auto';
let autoHeading=null;
let lastValidHeading=null;
let lastHeadingSource='—';

const $=id=>document.getElementById(id);
const KEY_STORAGE='cwaWindApiKey';

function loadSavedKey(){
  try{
    const saved=localStorage.getItem(KEY_STORAGE);
    if(saved){
      $('key').value=saved;
      $('rememberKey').checked=true;
    }
  }catch(e){}
}

function saveKeyIfNeeded(){
  try{
    if($('rememberKey').checked && $('key').value.trim()){
      localStorage.setItem(KEY_STORAGE,$('key').value.trim());
    }else if(!$('rememberKey').checked){
      localStorage.removeItem(KEY_STORAGE);
    }
  }catch(e){}
}

$('key').addEventListener('change',saveKeyIfNeeded);
$('key').addEventListener('blur',saveKeyIfNeeded);

$('rememberKey').addEventListener('change',()=>{
  saveKeyIfNeeded();
});

$('clearKeyBtn').onclick=()=>{
  try{localStorage.removeItem(KEY_STORAGE)}catch(e){}
  $('key').value='';
  $('rememberKey').checked=false;
  $('status').textContent='已清除這台裝置記憶的 API Key';
};

function rad(x){return x*Math.PI/180}
function deg(x){return x*180/Math.PI}
function norm360(x){return (x%360+360)%360}
function angDiff(a,b){let d=Math.abs(norm360(a)-norm360(b));return d>180?360-d:d}

function hav(lat1,lon1,lat2,lon2){
  const R=6371;
  const dLat=rad(lat2-lat1),dLon=rad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(rad(lat1))*Math.cos(rad(lat2))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a))
}

function bearing(lat1,lon1,lat2,lon2){
  const p1=rad(lat1),p2=rad(lat2),dl=rad(lon2-lon1);
  const y=Math.sin(dl)*Math.cos(p2);
  const x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);
  return norm360(deg(Math.atan2(y,x)))
}

function dirText(d){
  if(!isFinite(d)||d<0)return'—';
  const dirs=['北','北北東','東北','東北東','東','東南東','東南','南南東','南','南南西','西南','西南西','西','西北西','西北','北北西'];
  return dirs[Math.round(d/22.5)%16]
}

function validNum(x){
  const n=+x;
  return Number.isFinite(n)&&n>-90?n:null
}

function getWGS84(st){
  const cs=st?.GeoInfo?.Coordinates||[];
  const c=cs.find(x=>x.CoordinateName==='WGS84')||cs[0];
  return c?{lat:+c.StationLatitude,lon:+c.StationLongitude}:null
}

function getHeading(){
  if(mode==='manual') return +$('manualHeading').value;
  if(autoHeading!==null) return autoHeading;
  if(lastValidHeading!==null) return lastValidHeading;
  return +$('manualHeading').value;
}

function windParts(wd,ws,heading){
  const d=rad(wd-heading);
  const head=ws*Math.cos(d);
  const cross=Math.abs(ws*Math.sin(d));
  const tail=Math.max(0,-head);
  const headOnly=Math.max(0,head);
  let type='側風';
  const ad=angDiff(wd,heading);
  if(ad<=45) type='逆風';
  else if(ad>=135) type='順風';
  else if(headOnly>0) type='側逆風';
  else type='側順風';
  return{head:headOnly,tail,cross,type}
}

function typeClass(t){
  return t.includes('逆')?'bad':t.includes('順')?'ok':'warn'
}

function stationHtml(s,i,heading){
  const p=windParts(s.wd,s.ws,heading);
  return `<div class="station">
    <div><b>${i+1}. ${s.name}</b> <span class="muted">${s.id}</span>
      <span class="pill ${typeClass(p.type)}">${p.type}</span>
    </div>
    <div>${s.county}${s.town}｜${s.dist.toFixed(1)} km</div>
    <div>風向：${dirText(s.wd)} ${s.wd.toFixed(0)}°｜風速：<b>${s.ws.toFixed(1)} m/s</b>${s.gust!==null?`｜陣風：${s.gust.toFixed(1)} m/s`:''}</div>
    <div>逆風：<b>${p.head.toFixed(1)}</b>｜順風：<b>${p.tail.toFixed(1)}</b>｜側風：<b>${p.cross.toFixed(1)} m/s</b></div>
    <div class="muted">觀測：${s.obs||'—'}</div>
  </div>`
}

function buildSummary(stations,heading){
  if(!stations.length)return'沒有可用測站資料';
  let x=0,y=0,sumW=0,sumS=0;
  for(const s of stations){
    const w=Math.max(s.ws,0.1);
    x+=w*Math.cos(rad(s.wd));
    y+=w*Math.sin(rad(s.wd));
    sumW+=w; sumS+=s.ws;
  }
  const meanDir=norm360(deg(Math.atan2(y,x)));
  const r=Math.sqrt(x*x+y*y)/sumW;
  const consistency=r>0.75?'高':r>0.45?'中':'低';
  const avg=sumS/stations.length;
  const p=windParts(meanDir,avg,heading);
  return `主風向約 <b>${dirText(meanDir)} ${meanDir.toFixed(0)}°</b>，平均風速約 <b>${avg.toFixed(1)} m/s</b>；方向一致性：<b>${consistency}</b>。<br>對目前騎乘方向 <b>${dirText(heading)} ${heading.toFixed(0)}°</b> 約為 <b class="${typeClass(p.type)}">${p.type}</b>（逆風 ${p.head.toFixed(1)} / 順風 ${p.tail.toFixed(1)} / 側風 ${p.cross.toFixed(1)} m/s）。`
}

function updateStationGeometry(){
  if(!currentPos)return;
  for(const s of allStations){
    s.dist=hav(currentPos.lat,currentPos.lon,s.lat,s.lon);
    s.bearing=bearing(currentPos.lat,currentPos.lon,s.lat,s.lon);
  }
}

function renderHeading(){
  const h=getHeading();
  if(mode==='auto'){
    $('headingDisplay').innerHTML = lastValidHeading===null
      ? '尚未取得有效方向'
      : `<b>${dirText(h)} ${h.toFixed(0)}°</b> <span class="muted">（${lastHeadingSource}）</span>`;
  }
}

function render(){
  if(!allStations.length||!currentPos)return;
  const heading=getHeading();
  updateStationGeometry();

  const nearest=[...allStations].sort((a,b)=>a.dist-b.dist).slice(0,5);
  $('stations').innerHTML=nearest.map((s,i)=>stationHtml(s,i,heading)).join('');
  $('summary').innerHTML=buildSummary(nearest,heading);

  const ahead=[...allStations]
    .filter(s=>s.dist>=5&&s.dist<=80&&angDiff(s.bearing,heading)<=60)
    .sort((a,b)=>a.dist-b.dist)
    .slice(0,3);

  $('ahead').innerHTML=ahead.length
    ? ahead.map((s,i)=>stationHtml(s,i,heading)).join('')
    : '目前條件下找不到前方 5–80 km 的有效測站';
}

function setMode(newMode){
  mode=newMode;
  $('autoBtn').classList.toggle('active',mode==='auto');
  $('manualBtn').classList.toggle('active',mode==='manual');
  $('autoPanel').style.display=mode==='auto'?'block':'none';
  $('manualPanel').style.display=mode==='manual'?'block':'none';
  renderHeading();
  render();
}

$('autoBtn').onclick=()=>setMode('auto');
$('manualBtn').onclick=()=>setMode('manual');
$('manualHeading').onchange=()=>render();

function startTracking(){
  if(!navigator.geolocation){
    $('status').textContent='此瀏覽器不支援定位';
    return;
  }
  if(watchId!==null){
    $('status').textContent='GPS 已在追蹤中';
    return;
  }

  $('status').textContent='GPS 追蹤啟動中…';

  watchId=navigator.geolocation.watchPosition(
    p=>{
      const now={
        lat:p.coords.latitude,
        lon:p.coords.longitude,
        acc:p.coords.accuracy,
        speed:p.coords.speed,
        heading:p.coords.heading,
        t:p.timestamp
      };

      currentPos=now;
      $('pos').textContent=`${now.lat.toFixed(6)}, ${now.lon.toFixed(6)}（±${Math.round(now.acc)} m）`;

      const kmh=(now.speed!==null&&isFinite(now.speed)) ? now.speed*3.6 : null;
      $('speed').textContent=`速度：${kmh===null?'—':kmh.toFixed(1)+' km/h'}`;

      let candidate=null;
      let source='';

      // 1) 優先使用瀏覽器/裝置提供的 GPS heading（通常需移動中才有）
      if(now.heading!==null && isFinite(now.heading) && kmh!==null && kmh>=5){
        candidate=norm360(now.heading);
        source='GPS heading';
      }

      // 2) 若沒有 heading，使用前後定位點推算 bearing
      if(candidate===null && lastPos){
        const movedKm=hav(lastPos.lat,lastPos.lon,now.lat,now.lon);
        const dt=(now.t-lastPos.t)/1000;
        const derivedSpeed=dt>0 ? movedKm/dt*3600 : 0;

        // 避免靜止時 GPS 漂移：至少移動 20m，且推算速度 >= 5km/h
        if(movedKm>=0.020 && derivedSpeed>=5){
          candidate=bearing(lastPos.lat,lastPos.lon,now.lat,now.lon);
          source='GPS 位置推算';
        }
      }

      if(candidate!==null){
        autoHeading=candidate;
        lastValidHeading=candidate;
        lastHeadingSource=source;
      }else{
        autoHeading=null; // 停車時使用 lastValidHeading
      }

      lastPos=now;
      renderHeading();
      render();

      $('status').textContent='GPS 追蹤中';
    },
    e=>{
      $('status').textContent=`定位失敗（${e.code}）：${e.message}`;
    },
    {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:5000
    }
  );
}

function stopTracking(){
  if(watchId!==null){
    navigator.geolocation.clearWatch(watchId);
    watchId=null;
    $('status').textContent='GPS 追蹤已停止';
  }
}

$('startBtn').onclick=startTracking;
$('stopBtn').onclick=stopTracking;

$('loadBtn').onclick=async()=>{
  const key=$('key').value.trim();
  if(!key){alert('請先貼上 CWA API Key');return}
  saveKeyIfNeeded();
  if(!currentPos){alert('請先啟動 GPS 追蹤並取得位置');return}

  $('status').textContent='讀取 CWA 即時資料…';

  try{
    const r=await fetch(`${API_BASE}?Authorization=${encodeURIComponent(key)}`);
    if(!r.ok)throw new Error(`HTTP ${r.status}`);

    const j=await r.json();

    allStations=(j?.records?.Station||[]).map(st=>{
      const c=getWGS84(st);
      if(!c)return null;

      const w=st.WeatherElement||{};
      const ws=validNum(w.WindSpeed);
      const wd=validNum(w.WindDirection);

      if(ws===null||wd===null)return null;

      return{
        name:st.StationName,
        id:st.StationId,
        county:st.GeoInfo?.CountyName||'',
        town:st.GeoInfo?.TownName||'',
        obs:st.ObsTime?.DateTime||'',
        lat:c.lat,
        lon:c.lon,
        dist:hav(currentPos.lat,currentPos.lon,c.lat,c.lon),
        bearing:bearing(currentPos.lat,currentPos.lon,c.lat,c.lon),
        wd,ws,
        gust:validNum(w?.GustInfo?.PeakGustSpeed)
      }
    }).filter(Boolean);

    render();
    $('status').textContent=`更新完成，共讀取 ${allStations.length} 個有效測站`;
  }catch(e){
    $('status').textContent='讀取失敗：'+e.message;
  }
};

// 載入這台裝置先前記憶的 API Key
loadSavedKey();

// 頁面離開時停止 GPS
window.addEventListener('beforeunload',stopTracking);
</script>
</body>
</html>
